# 로컬 개발용 인프라 (PostgreSQL + Redis)
# 사용법: docker compose up -d --build
#
# ★ 스키마를 처음부터 다시 만들고 싶으면:
#     docker compose down -v && docker compose up -d --build
#   -v 가 볼륨을 지워 initdb 스크립트가 다시 돌고 Flyway가 V1부터 재실행됩니다.
#   운영 전까지는 이게 가장 편한 초기화 방법입니다.
services:
  db:
    build:
      context: ./docker/db
    environment:
      # .env 나 셸 환경변수로 덮어쓸 수 있습니다.
      # CI 는 저장소에 커밋된 로컬 기본값을 쓰지 않고 자체 값을 주입합니다.
      POSTGRES_DB: ${DB_NAME:-inform}
      POSTGRES_USER: ${DB_USER:-inform}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localpassword}
      # initdb 스크립트가 inform_crawler 롤을 만들 때 사용
      CRAWLER_PASSWORD: ${CRAWLER_PASSWORD:-localcrawlerpassword}
    ports:
      # 왼쪽만 호스트에 노출되는 포트다. 컨테이너 안 PostgreSQL 은 항상 5432 다.
      # 로컬에 이미 PostgreSQL 이 떠 있거나 다른 프로젝트 컨테이너와 겹치면
      # .env 에 DB_PORT 를 바꿔 쓴다 (compose 가 .env 를 자동으로 읽는다).
      # 같은 값을 앱의 DB_PORT 로도 쓰므로 한 곳만 고치면 된다.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inform"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pg-data:
