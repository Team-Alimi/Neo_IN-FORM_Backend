# 로컬 개발용 인프라 (PostgreSQL + Redis)
# 사용법: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inform
      POSTGRES_USER: inform
      POSTGRES_PASSWORD: localpassword
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inform"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pg-data:
