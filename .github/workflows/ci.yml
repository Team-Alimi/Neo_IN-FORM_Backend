name: CI

# v1 워크플로는 빌드 후 GCP VM 으로 SCP + SSH 배포까지 수행했습니다.
# v2 에서 전부 제거했습니다. 이유는 셋입니다.
#   1) GCP 프로젝트가 소실되었습니다 (v1 데이터 전손). 배포 대상이 존재하지 않습니다.
#   2) 전송하던 Dockerfile / nginx / init-letsencrypt.sh 가 v2 에 없습니다.
#   3) v2 인프라는 AWS EC2 + Docker 이며 배포 파이프라인을 새로 설계해야 합니다.
# 배포는 Phase 1~2 완료 후 별도 워크플로로 추가합니다.

on:
  push:
    branches: [ "main", "v2" ]
  pull_request:
    branches: [ "main", "v2" ]

# 같은 브랜치에 연달아 push 하면 이전 실행을 취소합니다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 의존성/빌드 캐시를 알아서 관리합니다.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # application.yml 은 비밀값이 없어 저장소에 커밋되어 있습니다.
      # 비밀값은 전부 환경변수로 주입하므로 CI 에서 설정 파일을 만들 필요가 없습니다.
      # (v1 은 secrets.APPLICATION_YAML 로 파일을 생성했습니다)
      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

