name: Deploy

# main 에 push → CI 통과 → 이 워크플로가 이미지를 만들어 GHCR 에 올리고
# SSM Run Command 로 서버에 배포를 지시합니다.
#
# ★ SSH 로 배포하지 않습니다.
#   운영 인스턴스는 보안 그룹에서 22 번을 아예 열지 않았습니다.
#   흔히 쓰는 appleboy/ssh-action 류가 전부 동작하지 않습니다.
#   대신 SSM Run Command 를 씁니다 — Session Manager 와 같은 경로라
#   포트를 새로 열지 않고, 접속 기록도 CloudTrail 에 남습니다.
#
# ★ workflow_run 으로 CI 에 매답니다.
#   push 에 직접 걸면 테스트가 깨진 코드도 배포됩니다.
#   앱 이미지 빌드는 -x test 라 테스트를 돌지 않기 때문에 더 그렇습니다.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:      # 수동 배포 (롤백·재시도용)

# 배포는 겹치면 안 됩니다. 진행 중인 건 취소하지 않고 큐에 넣습니다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write         # GHCR push
  id-token: write         # ★ OIDC 로 AWS 역할을 빌리는 데 필수

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    # CI 가 실패했으면 배포하지 않습니다.
    # workflow_dispatch(수동)로 부른 경우는 이 조건을 건너뜁니다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # ★ CI 가 검증한 바로 그 커밋을 빌드합니다.
      #   workflow_run 에서 github.sha 는 기본 브랜치의 최신 커밋이라,
      #   그동안 새 커밋이 들어왔으면 "테스트 안 된 코드"를 배포하게 됩니다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        id: meta
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "tag=sha-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/inform-app:sha-${SHA:0:7}" \
            | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      # 태그에 커밋 SHA 를 씁니다. latest 를 재사용하면 서버에서 도는 게
      # 어느 코드인지 알 수 없고, 롤백할 대상도 지목할 수 없습니다.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # PAT 불필요

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          # Gradle 의존성 레이어를 재사용합니다. 없으면 매번 전부 다시 받습니다.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # OIDC — 저장된 액세스 키가 없습니다. GitHub 이 매 실행마다
      # 이 저장소·브랜치임을 증명하고 임시 자격증명을 받습니다.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy via SSM
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          REPO_DIR: /home/ssm-user/inform
        run: |
          set -euo pipefail

          # SSM 은 root 로 실행됩니다. git 저장소와 docker 설정이 ssm-user
          # 소유라, root 로 git 을 돌리면 "dubious ownership" 으로 거부당하고
          # 파일 소유자도 뒤섞입니다. 그래서 ssm-user 로 낮춰서 실행합니다.
          #
          # git pull 을 먼저 따로 도는 이유: 그래야 이번 배포가
          # 방금 받은 최신 deploy.sh 로 실행됩니다.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $IMAGE" \
            --parameters commands="[
              \"sudo -u ssm-user git -C $REPO_DIR pull --ff-only\",
              \"sudo -u ssm-user bash $REPO_DIR/scripts/deploy.sh $IMAGE\"
            ]" \
            --query Command.CommandId --output text)

          echo "SSM CommandId: $CMD_ID"

          # send-command 는 명령을 "보내기만" 합니다. 결과를 안 기다리면
          # 배포가 실패해도 워크플로가 초록불로 끝납니다.
          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "  [$i] $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "── 서버 출력 ─────────────────────────────"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "── 오류 출력 ───────────────────────────"
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text || true
            echo "배포 실패 (상태: $STATUS)"
            exit 1
          fi

      - name: Verify from outside
        run: |
          # 서버 안에서의 health 는 deploy.sh 가 이미 봤습니다.
          # 여기서는 nginx·TLS 까지 포함한 실제 경로를 확인합니다.
          curl -fsS --retry 3 --retry-delay 5 \
            https://api.inha-inform.today/actuator/health | grep -q '"status":"UP"'
          echo "외부 접근 정상"
