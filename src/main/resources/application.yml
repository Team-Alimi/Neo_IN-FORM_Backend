spring:
  application:
    name: inform

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate        # 스키마는 Flyway가 관리 — update/create 금지
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 100    # N+1 완화
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: false   # v2는 빈 DB에서 시작

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

  servlet:
    multipart:
      # FIL-01 은 파일당 10MB 를 허용한다. 기본값(1MB/10MB)이면 앱이 검증에 닿기도 전에
      # 톰캣이 MaxUploadSizeExceededException 을 던져 우리 ErrorCode 가 아닌 오류가 나간다.
      # 요청 상한은 다중 업로드를 감안해 파일 상한보다 넉넉히 둔다.
      max-file-size: 10MB
      max-request-size: 60MB

  data.web.pageable:
    # 기본값(2000)이면 size=2000 요청 하나가 공지 2000건과 그만큼의 제공처·카테고리를
    # 한 번에 긁어간다. 화면에 필요한 최대치보다 넉넉한 선에서 잘라 둔다.
    max-page-size: 50
    default-page-size: 20
    # ★ 명세가 페이지를 1부터 셉니다. 응답만 +1 하고 이걸 켜지 않으면 요청과 응답이
    #   한 칸씩 어긋나 1페이지를 달라는 요청이 2페이지를 줍니다.
    #   PageResponse 의 currentPage 와 반드시 짝으로 움직여야 합니다.
    one-indexed-parameters: true

# 브라우저에서 이 API 를 부를 수 있는 출처.
# 운영 프론트(Vercel)와 로컬 개발 주소를 기본값에 둡니다 — 프론트가 설정 없이 붙습니다.
# 임시로 다른 출처를 열어야 하면 CORS_ALLOWED_ORIGINS 로 통째로 덮어씁니다(추가가 아니라 치환입니다).
#
# ★ 뒤에 슬래시를 붙이지 마세요. 브라우저가 보내는 Origin 헤더에는 경로도 슬래시도 없고
#   (https://inha-inform.today), 여기 값과 문자열이 정확히 같아야 통과합니다.
#   "https://inha-inform.today/" 로 적으면 영원히 안 맞는데 에러는 프론트에서만 납니다.
#
# ★ Vercel 프리뷰 배포(*-git-*.vercel.app)는 매번 주소가 바뀌어 여기에 담을 수 없습니다.
#   프리뷰에서는 구글 로그인도 origin_mismatch 로 막히므로 어차피 로그인 흐름을 못 봅니다.
#   프리뷰로 테스트하려면 그 주소를 구글 콘솔과 여기 양쪽에 같이 등록해야 합니다.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://inha-inform.today,https://www.inha-inform.today,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 3600000        # 1h (ms)
  refresh-token-validity: 1209600000    # 14d (ms)

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID}

inform:
  review:
    # ADM-12 "확인 필요 게시글" 판정 기준.
    # DB 가 아니라 설정에 두는 이유는 운영하며 조정할 값이기 때문이다.
    # 여기 있으면 배포만으로 바뀌고, 컬럼이었다면 매번 마이그레이션이 필요하다.
    similarity-threshold: 80
    # ★ 크롤러 팀과 미확정(Q12). 수집 본문의 실제 길이 분포를 봐야 정할 수 있다.
    #   지금은 "제목만 있고 본문이 사실상 비어 있는" 것을 걸러내는 선에서 잡아 둔다.
    min-content-length: 50

  notification:
    # SYS-03 생성(09:00) · SYS-04 정리(04:00) 시각은 NotificationScheduler 의
    # @Scheduled 기본값을 그대로 쓴다. 비활성화가 필요하면
    # inform.notification.deadline-cron 을 "-" 로 두면 Spring 이 등록을 건너뛴다.
    email:
      # NTF-05 알림 메일.
      #
      # ★ MAIL_FROM 이 없으면 발송 자체가 비활성이다(기동은 정상).
      #   서버 .env 는 gitignore 라 여기 키를 늘려도 서버엔 안 생긴다 — 손으로 넣어야 한다.
      #
      # ★ UNSUBSCRIBE_SECRET 이 없으면 메일에서 수신거부 문단만 빠진다.
      #   누를 수 없는 링크를 적어 두는 것보다 없는 편이 낫다.

      # 발송 대기 행을 확인하는 주기. 하루 한 번이 아닌 이유 —
      # SES 가 일시 실패하면 재시도가 다음 주기인데, 하루면 그게 24시간 뒤다.
      # 마감 하루 전 알림이 마감 당일에 도착하면 보낸 의미가 없다.
      # (@Scheduled 는 상수만 받으므로 프로퍼티 클래스가 아니라 이 키를 직접 읽는다)
      poll-interval-ms: 300000

      # ★ SES 프로덕션 액세스가 승인되면 이 둘을 올린다.
      #   샌드박스 한도는 1통/초 · 200통/일이다.
      send-interval: 1100ms
      batch-size: 100

      # 이보다 오래된 알림은 메일을 보내지 않는다.
      # 메일 수신을 꺼 둔 사용자의 알림은 email_sent_at 이 영원히 NULL 로 남는데,
      # 창이 없으면 그 사용자가 나중에 토글을 켜는 순간 지난 30일치가 한꺼번에 날아간다.
      max-age: 24h

      # 배치 중복 실행 방지(Redis). 한 번의 실행 시간보다 길어야 하며,
      # 짧으면 기동 시점에 거부된다(NotificationEmailProperties).
      lock-ttl: 10m

      # 메일에 들어가는 주소. 뒤에 슬래시를 붙이지 마세요.
      #   base-url    = 수신거부 페이지를 그리는 API 호스트
      #   service-url = 본문의 "확인하기" 가 가리키는 프론트 주소
      # ★ 공지 상세로 바로 보내지 않는다 — 프론트 경로를 추측해 넣으면
      #   죽은 링크가 메일에 박히고, 받은 사람이 눌러 본 뒤에야 드러난다.
      base-url: ${MAIL_BASE_URL:https://api.inha-inform.today}
      service-url: ${MAIL_SERVICE_URL:https://inha-inform.today}

  view-count:
    # Redis 에 모인 조회수를 DB 에 반영하는 주기.
    # view_count 는 재계산할 원천이 없어서, 반영 전에 프로세스가 죽으면 그 구간은 사라진다.
    # 주기를 짧게 둘수록 손실 구간이 짧아지고, 대신 UPDATE 가 잦아진다.
    flush-interval-ms: 60000

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${S3_BUCKET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    today.inform: ${LOG_LEVEL:INFO}
