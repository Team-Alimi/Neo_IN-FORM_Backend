spring:
  application:
    name: inform

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate        # 스키마는 Flyway가 관리 — update/create 금지
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 100    # N+1 완화
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: false   # v2는 빈 DB에서 시작

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 3600000        # 1h (ms)
  refresh-token-validity: 1209600000    # 14d (ms)

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${S3_BUCKET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    today.inform: ${LOG_LEVEL:INFO}
