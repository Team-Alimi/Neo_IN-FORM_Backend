# INFORM v2 리버스 프록시
#
# 배치:  sudo cp docker/nginx/inform.conf /etc/nginx/conf.d/inform.conf
#        sudo nginx -t && sudo systemctl reload nginx
#
# ★ 이 파일은 HTTP(80) 상태입니다. TLS 는 certbot 이 자동으로 붙입니다:
#
#        sudo dnf install -y nginx certbot python3-certbot-nginx
#        sudo systemctl enable --now nginx
#        sudo certbot --nginx -d api.inha-inform.today
#
#   certbot 이 이 파일에 443 서버 블록과 인증서 경로를 써 넣고,
#   80 을 443 으로 리다이렉트하도록 고칩니다. 그 뒤에는 손으로 고치지 마세요 —
#   갱신 때 덮어써질 수 있습니다. 바꿀 게 있으면 certbot 실행 전에 여기서 바꾸세요.
#
# ★ 갱신 자동화 확인 (안 하면 90일 뒤 전면 장애):
#        systemctl list-timers | grep certbot
#        sudo certbot renew --dry-run

server {
    listen 80;
    listen [::]:80;
    server_name api.inha-inform.today;

    # 첨부 업로드(FIL-01)가 파일당 10MB 를 허용합니다.
    # nginx 기본값은 1MB 라, 이걸 안 올리면 앱에 닿기도 전에 413 이 납니다.
    client_max_body_size 12M;

    # 헬스체크는 접근 로그에서 뺍니다. 5분마다 찍히면 로그가 그것만 남습니다.
    location /actuator/health {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # ★ 이걸 빠뜨리면 Spring 이 요청을 http 로 착각합니다.
        #   리다이렉트가 https:// 대신 http:// 로 나가고, 브라우저가 막거나 무한 루프가 됩니다.
        #   프록시 뒤에 앱을 두는 구성에서 가장 흔한 사고입니다.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # 앱이 뜨는 중(Flyway 마이그레이션)에는 응답이 늦을 수 있습니다.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
